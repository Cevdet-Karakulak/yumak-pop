name: Build Android (AAB & APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
      - 'store_listing_translations.*'
      - 'release_notes.txt'

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Keystore and Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          
          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          target_signing = 'signingConfigs {'
          replacement_signing = '''signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'yumakpop2026'
                      keyAlias System.getenv('KEY_ALIAS') ?: 'yumakpop'
                      keyPassword System.getenv('KEY_PASSWORD') ?: 'yumakpop2026'
                  }'''

          content = content.replace(target_signing, replacement_signing, 1)

          parts = content.split('buildTypes {')
          bt = parts[1]
          release_parts = bt.split('release {')
          release_parts[1] = release_parts[1].replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release', 1)
          parts[1] = 'release {'.join(release_parts)
          content = 'buildTypes {'.join(parts)

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print('build.gradle successfully patched with release signingConfig')
          "

      - name: Build AAB & APK with Gradle
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Prepare Output Artifacts
        run: |
          mkdir -p build-outputs
          cp android/app/build/outputs/bundle/release/*.aab build-outputs/YumakPop-v1.0.0-build6.aab
          cp android/app/build/outputs/apk/release/*.apk build-outputs/YumakPop-v1.0.0-release.apk
          ls -la build-outputs/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YumakPop-Android-Release
          path: build-outputs/
          retention-days: 14
