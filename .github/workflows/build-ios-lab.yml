name: "Build iOS IPA (Lab Sandbox v2)"

on:
  workflow_dispatch:
  push:
    branches:
      - lab-sandbox-v2

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: "iOS IPA Build (macOS Runner)"
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Select Xcode"
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -switch "$LATEST_XCODE"
          fi
          xcodebuild -version
          swift --version

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Apply Swift Compatibility Patches"
        run: node scripts/patch-ios-swift.js

      - name: "Expo iOS Prebuild"
        run: npx expo prebuild --platform ios --clean --no-install

      - name: "CocoaPods install"
        run: |
          cd ios
          pod install
          cd ..

      - name: "Build iOS Device App (Release ARM64)"
        run: |
          xcodebuild -workspace ios/YumakPop.xcworkspace \
            -scheme YumakPop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

          APP_PATH=$(find build_device/Build/Products -name "YumakPop.app" | head -n 1)
          echo "Found Device App at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r YumakPop-Lab-unsigned.ipa Payload/
          ls -lh YumakPop-Lab-unsigned.ipa

      - name: "Build iOS Simulator App"
        run: |
          xcodebuild -workspace ios/YumakPop.xcworkspace \
            -scheme YumakPop \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

          SIM_APP_PATH=$(find build_sim/Build/Products -name "YumakPop.app" | head -n 1)
          echo "Found Simulator App at: $SIM_APP_PATH"
          cd "$(dirname "$SIM_APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/YumakPop-Lab-Simulator.zip" "$(basename "$SIM_APP_PATH")"
          cd "$GITHUB_WORKSPACE"
          ls -lh YumakPop-Lab-Simulator.zip

      - name: "Upload iOS Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "ios-lab-builds"
          path: |
            YumakPop-Lab-unsigned.ipa
            YumakPop-Lab-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: "Publish GitHub Release (Direct IPA Download)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-lab-build.${{ github.run_number }}"
          name: "Yumak Pop Lab v1.0.0 - iOS IPA (Build #${{ github.run_number }})"
          body: |
            ## 🧶 Yumak Pop Lab: iOS IPA Paketi (Build #${{ github.run_number }})

            Bu sürüm **GitHub Actions macOS sunucularında** EAS kotası harcanmadan otomatik olarak derlenmiştir.

            ### 📦 İndirme Dosyaları:
            * **`YumakPop-Lab-unsigned.ipa`**: iPhone ve iPad cihazlar için IPA paketi. (Sideloadly, AltStore, Scarlet, TrollStore ile veya Apple Developer sertifikası ile doğrudan yüklenebilir).
            * **`YumakPop-Lab-Simulator.zip`**: Mac Xcode iOS Simulator için sürükle-bırak test paketi.

            ### 🧪 Bu Sürümdeki Yenilikler:
            * 🪵 **Bobbin'in Gerçekçi Ahşap Atölyesi** (Stop-motion diorama, torna kayın sallanan koltuk, kışlık zanaatkar kostümü)
            * 🎵 **Sakin ASMR Kalimba Akorları** (Do-Mi-Sol-Si-Do tınıları & %25 yumuşak Slo-Mo modu)
            * 🔀 **Seçici Çatal Parkur (Bölüm 115)** (Y-kavşağında iki kuyuya akan çift başlı yılan)

            ---
            *FloppaTech Corp - Tüm Hakları Saklıdır.*
          files: |
            YumakPop-Lab-unsigned.ipa
            YumakPop-Lab-Simulator.zip
          draft: false
          prerelease: true
