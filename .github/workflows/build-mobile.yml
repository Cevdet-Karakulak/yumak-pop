name: "Build Mobile Apps (APK, AAB, iOS)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Derleme Hedefi (Tumu / Yalnizca Android / Yalnizca iOS)"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "android-only"
          - "ios-only"
      create_release:
        description: "GitHub Releases sayfasina indirme linki olarak yayinlansin mi?"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: "Android Build (APK & AAB)"
    runs-on: ubuntu-latest
    if: inputs.target != 'ios-only'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "TypeScript check"
        run: npx tsc --noEmit

      - name: "Verify 100 levels solvability"
        run: npx tsx scripts/check-levels.ts

      - name: "Expo Android Prebuild"
        run: npx expo prebuild --platform android --no-install --clean

      - name: "Generate Android release keystore"
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias yumakpop \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass yumakpop2026 \
            -keypass yumakpop2026 \
            -dname "CN=FloppaTech, OU=Mobile, O=FloppaTech Corp, L=Istanbul, ST=Istanbul, C=TR"

      - name: "Build Android Release APK & AAB"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          cd ..

      - name: "Sign Release APK"
        run: |
          BT_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BT_DIR"
          
          RAW_APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          
          $BT_DIR/zipalign -v -p 4 "$RAW_APK" android/app/build/outputs/apk/release/app-aligned.apk || cp "$RAW_APK" android/app/build/outputs/apk/release/app-aligned.apk
          $BT_DIR/apksigner sign --ks android/app/release.keystore --ks-pass pass:yumakpop2026 --ks-key-alias yumakpop --key-pass pass:yumakpop2026 --out YumakPop-v1.0.0-release.apk android/app/build/outputs/apk/release/app-aligned.apk
          $BT_DIR/apksigner verify YumakPop-v1.0.0-release.apk

      - name: "Sign Release AAB"
        run: |
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/app/release.keystore \
            -storepass yumakpop2026 \
            -keypass yumakpop2026 \
            "$AAB_FILE" yumakpop
          
          cp "$AAB_FILE" YumakPop-v1.0.0-release.aab

      - name: "Upload Android Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "android-builds"
          path: |
            YumakPop-v1.0.0-release.apk
            YumakPop-v1.0.0-release.aab
          if-no-files-found: warn

  build-ios:
    name: "iOS Build (IPA & Simulator)"
    runs-on: macos-15
    if: inputs.target != 'android-only'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Select latest Xcode"
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -switch "$LATEST_XCODE"
          fi
          xcodebuild -version
          swift --version

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Apply Swift Compatibility Patches"
        run: node scripts/patch-ios-swift.js

      - name: "Expo iOS Prebuild"
        run: npx expo prebuild --platform ios --no-install --clean

      - name: "CocoaPods install"
        run: |
          cd ios
          pod install

      - name: "Build iOS Device App (ARM64 Release)"
        run: |
          xcodebuild -workspace ios/YumakPop.xcworkspace \
            -scheme YumakPop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

          APP_PATH=$(find build_device/Build/Products -name "YumakPop.app" | head -n 1)
          echo "Found Device App at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r YumakPop-v1.0.0-unsigned.ipa Payload/

      - name: "Build iOS Simulator App"
        run: |
          xcodebuild -workspace ios/YumakPop.xcworkspace \
            -scheme YumakPop \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

          SIM_APP_PATH=$(find build_sim/Build/Products -name "YumakPop.app" | head -n 1)
          echo "Found Simulator App at: $SIM_APP_PATH"
          cd "$(dirname "$SIM_APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/YumakPop-v1.0.0-Simulator.zip" "$(basename "$SIM_APP_PATH")"
          cd "$GITHUB_WORKSPACE"

      - name: "Build Xcode Archive (Optional)"
        continue-on-error: true
        run: |
          xcodebuild -workspace ios/YumakPop.xcworkspace \
            -scheme YumakPop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/YumakPop.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true
          if [ -d "build/YumakPop.xcarchive" ]; then
            zip -r YumakPop-v1.0.0-xcarchive.zip build/YumakPop.xcarchive/
          fi

      - name: "Upload iOS Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "ios-builds"
          path: |
            YumakPop-v1.0.0-unsigned.ipa
            YumakPop-v1.0.0-Simulator.zip
            YumakPop-v1.0.0-xcarchive.zip
          if-no-files-found: warn

  create-release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && (inputs.create_release != false) && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Download Android Artifacts"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: "android-builds"
          path: "release-files/"

      - name: "Download iOS Artifacts"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: "ios-builds"
          path: "release-files/"

      - name: "List release files"
        run: |
          ls -la release-files/ || true

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.0-build.{0}', github.run_number) }}
          name: "Yumak Pop v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ## 🧶 Yumak Pop v1.0.0 Mobil Derleme Paketi

            Bu surum GitHub Actions uzerinden tek tikla otomatik olarak derlenmistir.

            ### 📦 Indirme Dosyalari:
            * **YumakPop-v1.0.0-release.apk**: Android telefon ve tabletler icin dogrudan yuklenebilir imzali APK paketi.
            * **YumakPop-v1.0.0-release.aab**: Google Play Console icin Android App Bundle yukleme paketi.
            * **YumakPop-v1.0.0-unsigned.ipa**: iOS cihazlar icin IPA paketi (Sideloadly, AltStore, TrollStore veya Apple Gelistirici Sertifikasi ile dogrudan yuklenebilir).
            * **YumakPop-v1.0.0-Simulator.zip**: Mac Xcode iOS Simulator icin surukle-birak test paketi.
            * **YumakPop-v1.0.0-xcarchive.zip**: Xcode App Store / TestFlight arsivi.

            ---
            *FloppaTech Corp - Tum Haklari Saklidir.*
          files: |
            release-files/*
          draft: false
          prerelease: false
