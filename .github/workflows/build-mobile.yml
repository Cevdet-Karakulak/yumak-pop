name: "Build Mobile Apps (APK, AAB, iOS)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "android-apk-aab"
          - "android-apk-only"
          - "ios-only"
      create_release:
        description: "Publish to GitHub Releases for direct download?"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: "Android Build (APK & AAB)"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android-apk-aab' || inputs.target == 'android-apk-only'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "TypeScript check"
        run: npx tsc --noEmit

      - name: "Verify 100 levels solvability"
        run: npx tsx scripts/check-levels.ts

      - name: "Expo Android Prebuild"
        run: npx expo prebuild --platform android --no-install --clean

      - name: "Generate Android release keystore"
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias yumakpop \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass yumakpop2026 \
            -keypass yumakpop2026 \
            -dname "CN=FloppaTech, OU=Mobile, O=FloppaTech Corp, L=Istanbul, ST=Istanbul, C=TR"

      - name: "Build Android Debug APK"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk YumakPop-v1.0.0-debug.apk

      - name: "Build Android Release APK & Sign"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..
          
          BT_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BT_DIR"
          
          RAW_APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          
          $BT_DIR/zipalign -v -p 4 "$RAW_APK" android/app/build/outputs/apk/release/app-aligned.apk || cp "$RAW_APK" android/app/build/outputs/apk/release/app-aligned.apk
          $BT_DIR/apksigner sign --ks android/app/release.keystore --ks-pass pass:yumakpop2026 --ks-key-alias yumakpop --key-pass pass:yumakpop2026 --out YumakPop-v1.0.0-release.apk android/app/build/outputs/apk/release/app-aligned.apk
          $BT_DIR/apksigner verify YumakPop-v1.0.0-release.apk

      - name: "Build Google Play AAB & Sign"
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android-apk-aab'
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon
          cd ..
          
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/app/release.keystore \
            -storepass yumakpop2026 \
            -keypass yumakpop2026 \
            "$AAB_FILE" yumakpop
          
          cp "$AAB_FILE" YumakPop-v1.0.0-release.aab

      - name: "Upload Android Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "android-builds"
          path: |
            YumakPop-v1.0.0-release.apk
            YumakPop-v1.0.0-debug.apk
            YumakPop-v1.0.0-release.aab
          if-no-files-found: warn

  build-ios:
    name: "iOS Build (IPA & Archive)"
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ios-only'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Expo iOS Prebuild"
        run: npx expo prebuild --platform ios --no-install --clean

      - name: "CocoaPods install"
        run: |
          cd ios
          pod install --repo-update

      - name: "Build iOS workspace (xcodebuild)"
        run: |
          xcodebuild -workspace ios/YumakPop.xcworkspace \
            -scheme YumakPop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/YumakPop.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: "Package IPA & archive"
        run: |
          mkdir -p Payload
          cp -r build/YumakPop.xcarchive/Products/Applications/YumakPop.app Payload/
          zip -r YumakPop-v1.0.0-unsigned.ipa Payload/
          zip -r YumakPop-v1.0.0-xcarchive.zip build/YumakPop.xcarchive/

      - name: "Upload iOS Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "ios-builds"
          path: |
            YumakPop-v1.0.0-unsigned.ipa
            YumakPop-v1.0.0-xcarchive.zip
          if-no-files-found: warn

  create-release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && (inputs.create_release == true || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Download Android Artifacts"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: "android-builds"
          path: "release-files/"

      - name: "Download iOS Artifacts"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: "ios-builds"
          path: "release-files/"

      - name: "List release files"
        run: |
          ls -la release-files/ || true

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build.${{ github.run_number }}"
          name: "Yumak Pop v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ## Yumak Pop v1.0.0 Mobil Derleme Paketi

            Bu sürüm GitHub Actions üzerinden otomatik olarak derlenmiştir.

            ### Indirme Dosyalari:
            * **YumakPop-v1.0.0-release.apk**: Android cihazlara dogrudan yuklenebilir imzali APK.
            * **YumakPop-v1.0.0-debug.apk**: Gelistirici test debug APK.
            * **YumakPop-v1.0.0-release.aab**: Google Play Console icin Android App Bundle.
            * **YumakPop-v1.0.0-unsigned.ipa**: iOS test IPA paketi.
            * **YumakPop-v1.0.0-xcarchive.zip**: Xcode App Store yukleme arsivi.

            FloppaTech Corp - Tum Haklari Saklidir.
          files: |
            release-files/*
          draft: false
          prerelease: false
