name: "Build Mobile Lab (APK & iOS IPA via GitHub Actions)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Derleme Hedefi"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "android-only"
          - "ios-only"
  push:
    branches:
      - lab-sandbox-v2

permissions:
  contents: write

jobs:
  # ==========================================
  # SMART TARGET DETECTION (Zero Redundant Builds)
  # ==========================================
  detect-target:
    name: "Detect Target Platform"
    runs-on: ubuntu-latest
    outputs:
      build_android: ${{ steps.detect.outputs.build_android }}
      build_ios: ${{ steps.detect.outputs.build_ios }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "Determine target platforms"
        id: detect
        run: |
          EVENT="${{ github.event_name }}"
          INPUT_TARGET="${{ inputs.target }}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Event: $EVENT"
          echo "Input target: $INPUT_TARGET"
          echo "Commit message: $COMMIT_MSG"

          BUILD_ANDROID="false"
          BUILD_IOS="false"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT_TARGET" = "android-only" ]; then
              BUILD_ANDROID="true"
            elif [ "$INPUT_TARGET" = "ios-only" ]; then
              BUILD_IOS="true"
            else
              BUILD_ANDROID="true"
              BUILD_IOS="true"
            fi
          else
            LOWER_MSG=$(echo "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')

            if echo "$LOWER_MSG" | grep -qE "\[all\]|\[both\]"; then
              BUILD_ANDROID="true"
              BUILD_IOS="true"
            elif echo "$LOWER_MSG" | grep -qE "\[android\]|\[apk\]|\[aab\]"; then
              BUILD_ANDROID="true"
              BUILD_IOS="false"
            elif echo "$LOWER_MSG" | grep -qE "\[ios\]|\[ipa\]|\[testflight\]"; then
              BUILD_ANDROID="false"
              BUILD_IOS="true"
            else
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD || true)
              echo "Changed files:"
              echo "$CHANGED_FILES"

              MENTIONS_IOS=$(echo "$LOWER_MSG" | grep -E "ios|apple|testflight|ipa" || true)
              MENTIONS_ANDROID=$(echo "$LOWER_MSG" | grep -E "android|apk|aab|play console|play store" || true)

              HAS_ANDROID_ONLY_FILES=$(echo "$CHANGED_FILES" | grep -E "^android/" || true)
              HAS_IOS_ONLY_FILES=$(echo "$CHANGED_FILES" | grep -E "^ios/|scripts/patch-ios-swift" || true)
              HAS_SRC_FILES=$(echo "$CHANGED_FILES" | grep -E "^src/|^assets/|^app.json|^package.json" || true)

              if [ -n "$MENTIONS_IOS" ] && [ -z "$MENTIONS_ANDROID" ]; then
                BUILD_IOS="true"
              elif [ -n "$MENTIONS_ANDROID" ] && [ -z "$MENTIONS_IOS" ]; then
                BUILD_ANDROID="true"
              elif [ -n "$HAS_ANDROID_ONLY_FILES" ] && [ -z "$HAS_IOS_ONLY_FILES" ] && [ -z "$HAS_SRC_FILES" ]; then
                BUILD_ANDROID="true"
              elif [ -n "$HAS_IOS_ONLY_FILES" ] && [ -z "$HAS_ANDROID_ONLY_FILES" ] && [ -z "$HAS_SRC_FILES" ]; then
                BUILD_IOS="true"
              else
                BUILD_ANDROID="true"
                BUILD_IOS="true"
              fi
            fi
          fi

          echo "Target Decision -> Android: $BUILD_ANDROID | iOS: $BUILD_IOS"
          echo "build_android=$BUILD_ANDROID" >> $GITHUB_OUTPUT
          echo "build_ios=$BUILD_IOS" >> $GITHUB_OUTPUT

  # ==========================================
  # ANDROID BUILD (APK & AAB - Zero EAS Quota)
  # ==========================================
  build-android:
    name: "Android Build (Ubuntu Runner)"
    runs-on: ubuntu-latest
    needs: [detect-target]
    if: needs.detect-target.outputs.build_android == 'true'
    timeout-minutes: 30

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Set Unique Android Version Code"
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const runNumber = parseInt(process.env.GITHUB_RUN_NUMBER || '1', 10);
            const newVersionCode = 20 + runNumber;
            app.expo.android.versionCode = newVersionCode;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('Set Android versionCode to: ' + newVersionCode);
          "

      - name: "Expo Android Prebuild"
        run: npx expo prebuild --platform android --no-install --clean

      - name: "Setup Keystore & Configure Single Release Certificate Signing"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production secret keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "Generating fallback release keystore"
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias yumakpop \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass yumakpop2026 \
              -keypass yumakpop2026 \
              -dname "CN=FloppaTech, OU=Mobile, O=FloppaTech Corp, L=Istanbul, ST=Istanbul, C=TR"
          fi

          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          target_signing = 'signingConfigs {'
          replacement_signing = '''signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'yumakpop2026'
                      keyAlias System.getenv('KEY_ALIAS') ?: 'yumakpop'
                      keyPassword System.getenv('KEY_PASSWORD') ?: 'yumakpop2026'
                  }'''

          content = content.replace(target_signing, replacement_signing, 1)

          parts = content.split('buildTypes {')
          bt = parts[1]
          release_parts = bt.split('release {')
          release_parts[1] = release_parts[1].replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release', 1)
          parts[1] = 'release {'.join(release_parts)
          content = 'buildTypes {'.join(parts)

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print('build.gradle successfully configured with single release signingConfig')
          "

      - name: "Build Android Release (APK & AAB)"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          cd ..

      - name: "Verify Single Certificate Chain & Prepare Outputs"
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found Signed Release APK at: $RAW_APK"
          cp "$RAW_APK" YumakPop-Lab-release.apk
          cp "$RAW_APK" YumakPop-v1.0.0-release.apk

          RAW_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$RAW_AAB" ]; then
            echo "Found Signed Release AAB at: $RAW_AAB"
            cp "$RAW_AAB" YumakPop-Lab-release.aab
            cp "$RAW_AAB" YumakPop-v1.0.0-release.aab

            echo "=== Verifying Single Certificate Chain in AAB ==="
            unzip -l YumakPop-Lab-release.aab | grep -i "META-INF" || true
          fi
          ls -lh YumakPop-*.apk YumakPop-*.aab

      - name: "Upload Android Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "android-lab-artifacts"
          path: |
            YumakPop-Lab-release.apk
            YumakPop-Lab-release.aab
            YumakPop-v1.0.0-release.aab
            YumakPop-v1.0.0-release.apk
          if-no-files-found: warn
          retention-days: 14

  # ==========================================
  # iOS BUILD (IPA - Zero EAS Quota)
  # ==========================================
  build-ios:
    name: "iOS IPA Build (macOS Runner)"
    runs-on: macos-15
    needs: [detect-target]
    if: needs.detect-target.outputs.build_ios == 'true'
    timeout-minutes: 45

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Select Xcode"
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -switch "$LATEST_XCODE"
          fi
          xcodebuild -version
          swift --version

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Apply Swift Compatibility Patches"
        run: node scripts/patch-ios-swift.js

      - name: "Set Unique iOS Build Number"
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const buildNum = String(2 + parseInt(process.env.GITHUB_RUN_NUMBER || '1', 10));
            cfg.expo.ios.buildNumber = buildNum;
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
            console.log('Set iOS buildNumber to:', buildNum);
          "

      - name: "Setup Apple Distribution Certificate & Provisioning Profile"
        id: signing
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export SIGN_DIR=$(mktemp -d "$RUNNER_TEMP/yumak-signing.XXXXXX")
          KEYCHAIN="$SIGN_DIR/yumak.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          echo "SIGN_DIR=$SIGN_DIR" >> $GITHUB_ENV

          python3 - <<'PY'
          import base64, os, plistlib
          from pathlib import Path
          sign_dir = Path(os.environ['SIGN_DIR'])
          (sign_dir / 'certificate.p12').write_bytes(base64.b64decode(os.environ['IOS_DISTRIBUTION_P12_BASE64']))
          (sign_dir / 'profile.mobileprovision').write_bytes(base64.b64decode(os.environ['IOS_PROFILE_BASE64']))
          PY

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$SIGN_DIR/certificate.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security cms -D -i "$SIGN_DIR/profile.mobileprovision" > "$SIGN_DIR/profile.plist"

          PROFILE_UUID=$(python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          sign_dir = Path(os.environ['SIGN_DIR'])
          profile = plistlib.loads((sign_dir / 'profile.plist').read_bytes())
          uuid = profile['UUID']
          team = os.environ['APPLE_TEAM_ID']
          bundle = 'com.floppatech.yumakpop'
          options = {
              'method': 'app-store-connect',
              'teamID': team,
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {bundle: uuid},
              'manageAppVersionAndBuildNumber': False,
              'uploadSymbols': True,
          }
          (sign_dir / 'exportOptions.plist').write_bytes(plistlib.dumps(options))
          print(uuid)
          PY
          )

          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> $GITHUB_ENV
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$SIGN_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$SIGN_DIR/profile.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "Configured Apple Distribution Profile UUID: $PROFILE_UUID"

      - name: "Expo iOS Prebuild"
        run: npx expo prebuild --platform ios --clean --no-install

      - name: "CocoaPods install"
        run: |
          cd ios
          pod install
          cd ..
          node scripts/patch-ios-swift.js

      - name: "Detect Workspace and Scheme"
        id: detect
        run: |
          WS=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Found workspace: $WS"
          echo "Found scheme: $SCHEME"
          echo "workspace=$WS" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      - name: "Archive & Export Signed iOS IPA (Release ARM64)"
        run: |
          xcodebuild -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build_archive/YumakPop.xcarchive \
            SWIFT_STRICT_CONCURRENCY=minimal \
            archive

          APP_PATH=$(find build_archive/YumakPop.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "Found Archived App at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr YumakPop-Lab-unsigned.ipa Payload/
          ls -lh YumakPop-Lab-unsigned.ipa

          xcodebuild -exportArchive \
            -archivePath build_archive/YumakPop.xcarchive \
            -exportOptionsPlist "$SIGN_DIR/exportOptions.plist" \
            -exportPath build_signed

          SIGNED_IPA=$(find build_signed -name "*.ipa" | head -n 1)
          cp "$SIGNED_IPA" YumakPop-AppStore-signed.ipa
          ls -lh YumakPop-AppStore-signed.ipa

      - name: "Upload to App Store Connect / TestFlight"
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app --type ios -f YumakPop-AppStore-signed.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: "Upload iOS Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "ios-lab-builds"
          path: |
            YumakPop-Lab-unsigned.ipa
            YumakPop-AppStore-signed.ipa
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # AUTOMATIC GITHUB RELEASE WITH DOWNLOAD LINKS
  # ==========================================
  create-release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [detect-target, build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Download Android Artifacts"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: "android-lab-artifacts"
          path: "release-files/"

      - name: "Reuse Previous Android APK if Skipped"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-files
          if [ ! -f "release-files/YumakPop-Lab-release.apk" ]; then
            gh release download v1.0.0-lab-build.2 -p "*.apk" -D release-files/ || true
          fi

      - name: "Download iOS Artifacts"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: "ios-lab-builds"
          path: "release-files/"

      - name: "List release files"
        run: ls -la release-files/ || true

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-lab-build.${{ github.run_number }}"
          name: "Yumak Pop Lab v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## 🧶 Yumak Pop Lab (Yenilikler Sandbox v2)

            Bu derleme **GitHub Actions** üzerinde EAS kotası harcanmadan otomatik olarak üretilmiştir.

            ### 📦 İndirilebilir Paketler:
            * **`YumakPop-Lab-release.apk`**: Android cihazlar için imzalı, doğrudan yüklenebilir APK dosyası.
            * **`YumakPop-Lab-unsigned.ipa`**: iPhone / iPad cihazlar için IPA paketi (Sideloadly, AltStore, Scarlet, TrollStore ile tek tıkla kurulabilir).
            * **`YumakPop-Lab-Simulator.zip`**: Mac Xcode iOS Simulator için sürükle-bırak test paketi.

            ### 🧪 Bu Sürümdeki Yenilikler:
            * 🪵 **Bobbin'in Gerçekçi Ahşap Atölyesi** (Stop-motion diorama, torna kayın sallanan koltuk, kışlık zanaatkar kostümü)
            * 🎵 **Sakin ASMR Kalimba Akorları** (Do-Mi-Sol-Si-Do tınıları & %25 yumuşak Slo-Mo modu)
            * 🔀 **Seçici Çatal Parkur (Bölüm 115)** (Y-kavşağında iki kuyuya akan çift başlı yılan)

            ---
            *FloppaTech Corp - Tüm Hakları Saklıdır.*
          files: |
            release-files/*
          draft: false
          prerelease: true
